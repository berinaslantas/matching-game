<title>İngilizce Eşleştirme Oyunu</title>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0d1117;
  color: #c9d1d9;
  padding: 20px;
  text-align: center;
}
select, button {
  margin: 6px;
  padding: 8px 12px;
  background: #161b22;
  color: #c9d1d9;
  border: 1px solid #30363d;
  border-radius: 6px;
  font-size: 14px;
}
.game {
  display: flex;
  gap: 12px;
  margin-top: 12px;
}
.column { width: 50%; }
.card {
  background: #161b22;
  padding: 14px;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid #30363d;
  cursor: pointer;
  transition: 0.15s;
  color: #c9d1d9;
  user-select: none;
}
.card.selected { border-color: #58a6ff; }
.card.correct { color:#2ea043; }
.card.wrong { color:#ff7f0e; }
</style>
</head>

const PAGE_SIZE = 5;
let pool = [];
let active = [];
let selLeft = null;
let selRight = null;
let streak = 0;

// Seçim kutusu elementlerini doğrudan al
const mainSelect = document.getElementById("mainUnit");
const subSelect = document.getElementById("subUnit");
const leftCol = document.getElementById("leftCol");
const rightCol = document.getElementById("rightCol");

/* ===== SESLER (iOS Uyumlu Tıklama ile Başlatma) ===== */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function playCorrect() {
  try {
    initAudio();
    streak++;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    let freq = 800 * (1 + streak * 0.2);
    if (freq > 2000) freq = 2000;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  } catch (e) {}
}

function playWrong() {
  try {
    initAudio();
    streak = 0;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
  } catch (e) {}
}

/* ===== GENEL YANLIŞLAR ===== */
const STORAGE_KEY = "general_wrongs_ingilizce";
let generalWrongs = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

function saveWrongs() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(generalWrongs));
}

function markWrong(p) {
  const k = p.left + "||" + p.right;
  if (!generalWrongs[k]) generalWrongs[k] = { wrong: 0, correct: 0, pair: p };
  generalWrongs[k].wrong++;
  saveWrongs();
}

function markCorrect(p) {
  const k = p.left + "||" + p.right;
  if (!generalWrongs[k]) return;
  generalWrongs[k].correct++;
  if (generalWrongs[k].correct >= 2) delete generalWrongs[k];
  saveWrongs();
}

/* ===== OYUN FONKSİYONLARI ===== */
function shuffle(a) {
  return a.sort(() => Math.random() - 0.5);
}

function fillSelectors() {
  mainSelect.innerHTML = "";
  Object.keys(units).forEach(k => {
    mainSelect.innerHTML += `<option value="${k}">${k}</option>`;
  });
  loadSub();
}

function loadSub() {
  subSelect.innerHTML = "";
  if (!units[mainSelect.value]) return;
  Object.keys(units[mainSelect.value]).forEach(k => {
    subSelect.innerHTML += `<option value="${k}">${k}</option>`;
  });
}

mainSelect.onchange = loadSub;

function startGame() {
  initAudio();
  streak = 0;
  if (!units[mainSelect.value] || !units[mainSelect.value][subSelect.value]) return;
  pool = shuffle([...units[mainSelect.value][subSelect.value]]);
  active = pool.splice(0, PAGE_SIZE);
  render();
}

function startGeneralWrongs() {
  initAudio();
  streak = 0;
  pool = shuffle(Object.values(generalWrongs).map(o => o.pair));
  active = pool.splice(0, PAGE_SIZE);
  render();
}

function render() {
  leftCol.innerHTML = "";
  rightCol.innerHTML = "";
  active.forEach(p => {
    const d = document.createElement("div");
    d.className = "card";
    d.innerText = p.left;
    d.onclick = () => { selLeft = p; select(d); };
    leftCol.appendChild(d);
  });
  shuffle([...active]).forEach(p => {
    const d = document.createElement("div");
    d.className = "card";
    d.innerText = p.right;
    d.onclick = () => { selRight = p; select(d); };
    rightCol.appendChild(d);
  });
}

function select(el) {
  document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
  el.classList.add("selected");
  if (selLeft && selRight) check();
}

function check() {
  const lCard = [...leftCol.children].find(c => c.innerText === selLeft.left && c.style.color !== "#2ea043");
  const rCard = [...rightCol.children].find(c => c.innerText === selRight.right && c.style.color !== "#2ea043");
  const correctRights = active.filter(p => p.left === selLeft.left).map(p => p.right);
  const correct = correctRights.includes(selRight.right);

  if (correct) {
    if (lCard) lCard.style.color = "#2ea043";
    if (rCard) rCard.style.color = "#2ea043";
    playCorrect();
    markCorrect(selLeft);
    setTimeout(() => {
      const idx = active.findIndex(p => p.left === selLeft.left && p.right === selRight.right);
      if (idx !== -1) active.splice(idx, 1);
      while (active.length < PAGE_SIZE && pool.length > 0) {
        active.push(pool.shift());
      }
      selLeft = selRight = null;
      render();
    }, 150);
  } else {
    if (lCard) lCard.style.color = "#ff7f0e";
    if (rCard) rCard.style.color = "#ff7f0e";
    playWrong();
    markWrong(selLeft);
    setTimeout(() => {
      if (lCard) lCard.style.color = "#c9d1d9";
      if (rCard) rCard.style.color = "#c9d1d9";
      selLeft = selRight = null;
    }, 300);
  }
}

// Sayfa açıldığında seçim kutularını otomatik doldur
fillSelectors();
